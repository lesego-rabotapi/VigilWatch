[pytest]
testpaths = tests
pythonpath = lambda scripts
markers =
    unit: pure logic, no AWS libraries (tests/unit)
    mock: handlers and repositories against moto (tests/mock)
    integration: a real or emulated backend such as LocalStack, moto server or DEV (tests/integration)
    contract: API shape against the OpenAPI-derived schema (tests/contract)
    bdd: Gherkin scenarios in tests/features (steps in tests/step_defs)
    e2e: post-deploy tests against a live API (set API_URL); deselected by default
    policy: repository, workflow, documentation and traceability rules (tests/test_*.py)
    smoke: quick post-deployment verification; read-only in prod
    negative: failure-path and rejection tests
    boundary: boundary-value tests
    security: abuse, injection and access-control tests
    req: requirement IDs (VW-nnn) a test proves; see docs/design/requirements.md
addopts = -m "not e2e" --strict-markers
