name: Promote to prod

# Deploys to prod the commit dev last deployed successfully (or the commit given, which must be
# that one), using the bundle dev built and stored for it: the same bytes, never rebuilt. The apply
# waits for a reviewer of the "production" environment. A release is tagged once prod passes its
# smoke test.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit id to promote (empty = the commit dev last released)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never interrupt a running apply

env:
  AWS_REGION: af-south-1

jobs:
  # Only reads the release record, so it uses the read-only role.
  resolve:
    name: Choose the commit
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' && vars.AWS_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Refuse any account but the configured one
        env:
          EXPECTED: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ "$(aws sts get-caller-identity --query Account --output text)" != "$EXPECTED" ]; then
            echo "::error::these credentials are not for the account in AWS_ACCOUNT_ID"
            exit 1
          fi
      - name: Choose the commit to promote
        id: sha
        env:
          REQUESTED: ${{ inputs.sha }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -n "$REQUESTED" ]; then
            sha="$REQUESTED"
          else
            record="$(bash scripts/release.sh "$BUCKET" dev)"
            if [ -z "$record" ]; then
              echo "::error::dev has no release yet: deploy dev first"
              exit 1
            fi
            sha="${record%% *}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Promoting $sha" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [resolve]
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' }}
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      sha: ${{ needs.resolve.outputs.sha }}
      require_dev_release: true

  release:
    name: Tag the release
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to find the previous release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The next free v2.<n>; prod deploys queue in one concurrency group, so two runs cannot race.
      - name: Choose the tag
        run: echo "TAG=$(git tag --list | python scripts/next_version.py)" >> "$GITHUB_ENV"
      - name: Write the changelog since the previous release
        run: |
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "$SHA^")"; then
            range="$previous..$SHA"
          else
            range="$SHA"
          fi
          python scripts/changelog.py "$range" --version "$TAG" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the release at the promoted commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md
