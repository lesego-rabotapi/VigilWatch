name: Plan (pull request)

# Shows what a pull request would change in dev before it merges. The plan job uses the read-only
# role (AWS_PLAN_ROLE_ARN): it reads state and resources, changes nothing, and does not take the
# state lock. A separate job with no AWS access posts the plan as a comment. Pull requests from
# forks are skipped: they get no OIDC token and must not reach the account.

on:
  pull_request:

permissions:
  contents: read

# bash -eo pipefail: without `shell:`, GitHub runs bash -e and ignores a failure mid-pipeline.
defaults:
  run:
    shell: bash

env:
  AWS_REGION: af-south-1
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan dev
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.AWS_PLAN_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bundle the change would deploy
        working-directory: .
        run: python scripts/build_bundle.py --out "$GITHUB_WORKSPACE/terraform/.build/vigilwatch.zip"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Refuse any account but the configured one
        env:
          EXPECTED: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ "$(aws sts get-caller-identity --query Account --output text)" != "$EXPECTED" ]; then
            echo "::error::these credentials are not for the account in AWS_ACCOUNT_ID"
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=vigilwatch/envs/dev.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      # -detailed-exitcode: 0 no changes, 2 changes (both fine here), 1 an error.
      - name: terraform plan
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          EMAIL: ${{ vars.NOTIFICATION_EMAIL }}
        run: |
          status=0
          terraform plan -lock=false -detailed-exitcode -no-color \
            -var-file="$GITHUB_WORKSPACE/terraform/.build/vigilwatch.tfvars.json" \
            -var "allowed_account_ids=[\"$ACCOUNT\"]" \
            -var "notification_email=$EMAIL" > plan.txt 2>&1 || status=$?
          if [ "$status" -eq 1 ]; then
            cat plan.txt
            exit 1
          fi
          # One line per changed resource, plus the totals (no pipe into head: pipefail + SIGPIPE).
          # A plan that changes only outputs has neither, so it is shown from "Changes to Outputs".
          {
            echo "### Terraform plan for dev"
            if [ "$status" -eq 0 ]; then
              echo "No changes."
            elif grep -E '^(Plan:|  # )' plan.txt > changes.txt; then
              echo '```'
              sed -n '1,100p' changes.txt
              echo '```'
            else
              echo "Only output values change."
              echo '```'
              sed -n '/^Changes to Outputs:/,$p' plan.txt | sed -n '1,100p'
              echo '```'
            fi
          } > "$GITHUB_WORKSPACE/comment.md"
          cat "$GITHUB_WORKSPACE/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-plan
          path: comment.md
          retention-days: 5

  comment:
    name: Post the plan
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-plan
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
