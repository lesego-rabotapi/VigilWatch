name: Deploy

# Repository configuration required (Settings -> Secrets and variables -> Variables):
#   AWS_DEPLOY_ROLE_ARN  output deploy_role_arn of terraform/bootstrap
#   AWS_ACCOUNT_ID       the account Terraform may touch (the provider refuses any other)
#   TF_STATE_BUCKET      output state_bucket of terraform/bootstrap
#   NOTIFICATION_EMAIL   optional alert recipient
# Until the first three are set, plan, apply and release are skipped rather than failing.
# and an Environment named "production" with required reviewers (the approval gate).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a running apply

env:
  AWS_REGION: af-south-1
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Terraform plan
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' }}
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Built once. The plan records this file's hash and apply deploys exactly these bytes.
      - name: Build the Lambda bundle
        working-directory: .
        run: |
          python scripts/build_bundle.py --out "$GITHUB_WORKSPACE/terraform/.build/vigilwatch.zip"
          echo "bundle_sha256: $(python -c "import json,sys; print(json.load(open(sys.argv[1]))['bundle_sha256'])" "$GITHUB_WORKSPACE/terraform/.build/vigilwatch.tfvars.json")" >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=vigilwatch/envs/prod.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: terraform plan
        run: >
          terraform plan -out=tfplan
          -var-file="$GITHUB_WORKSPACE/terraform/.build/vigilwatch.tfvars.json"
          -var 'allowed_account_ids=["${{ vars.AWS_ACCOUNT_ID }}"]'
          -var "notification_email=${{ vars.NOTIFICATION_EMAIL }}"
      - name: Plan summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The saved plan references the Lambda bundle built during plan, so ship both.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/envs/prod/tfplan
            terraform/.build/
          retention-days: 5
          include-hidden-files: true

  apply:
    name: Terraform apply (approval required)
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' }}
    needs: [plan]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.outputs.outputs.dashboard_url }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=vigilwatch/envs/prod.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: terraform apply (exactly the reviewed plan)
        run: terraform apply tfplan
      - name: Read outputs
        id: outputs
        run: |
          echo "dashboard_url=$(terraform output -raw dashboard_url)" >> "$GITHUB_OUTPUT"
          echo "api_base_url=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ steps.outputs.outputs.distribution_id }}"
          --paths "/*"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Production: read-only checks only, nothing is registered.
      - name: Post-deploy smoke test
        working-directory: .
        env:
          API_URL_PROD: ${{ steps.outputs.outputs.api_base_url }}
          DASHBOARD_URL_PROD: ${{ steps.outputs.outputs.dashboard_url }}
          E2E_READONLY_URL: ${{ vars.E2E_READONLY_URL }}
        run: |
          pip install -r requirements-dev.txt
          pytest -m e2e tests/e2e --env=prod -v

  release:
    name: Tag release
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' }}
    needs: [apply]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          git tag "v2.${{ github.run_number }}"
          git push origin "v2.${{ github.run_number }}"
